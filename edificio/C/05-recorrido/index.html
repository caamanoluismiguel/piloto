<style>
  :root { --fondo:#15130f; --panel:#221f1a; --linea:#3a352c; --linea-2:#4a4438; --texto:#efe8da; --tenue:#a99f8c; --sol:#f4b545; --cal:#efe9de; }
  html, body { margin:0; height:100%; background:var(--fondo); color:var(--texto); font:14px/1.4 system-ui, sans-serif; overflow:hidden; }
  canvas { display:block; touch-action:none; }
  #arriba { position:fixed; left:16px; top:16px; right:16px; display:flex; gap:12px; align-items:flex-start; pointer-events:none; }
  #info { font-size:12px; color:var(--tenue); padding-top:4px; min-width:0; }
  #info b { color:var(--texto); font-weight:600; }
  .volver { pointer-events:auto; flex:none; display:inline-flex; align-items:center; min-height:44px; padding:0 16px; border-radius:999px; border:1px solid var(--linea); background:var(--fondo); color:var(--texto); text-decoration:none; font-size:14px; box-sizing:border-box; }
  .volver:focus-visible { outline:2px solid var(--sol); outline-offset:2px; }
  .volver .corto { display:none; }
  #barra { position:fixed; left:16px; right:16px; bottom:16px; padding:8px; background:var(--panel); border:1px solid var(--linea-2); border-radius:18px; display:grid; grid-template-columns:auto auto auto auto 1fr auto; gap:8px; align-items:center; max-width:720px; margin:0 auto; }
  button { min-width:44px; min-height:44px; border-radius:12px; border:1px solid var(--linea); background:var(--fondo); color:var(--texto); font-size:16px; cursor:pointer; padding:0 12px; font-family:inherit; }
  button:disabled { opacity:.4; cursor:default; }
  button svg { display:block; margin:0 auto; }
  button:focus-visible, .nodo-mapa:focus-visible { outline:2px solid var(--sol); outline-offset:2px; }
  #inicio { font-size:15px; }
  #play { background:var(--sol); color:#15130f; border-color:var(--sol); }
  #mapaBtn[aria-expanded=true] { border-color:var(--cal); }
  #lugar { font-size:13px; line-height:1.25; min-width:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  #lugarTexto { overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; min-width:0; }
  #lugarTexto span { color:var(--tenue); }
  #verFotos { font-size:13px; min-height:36px; padding:0 10px; }
  #verFotos[hidden] { display:none; }
  /* Teléfono: el nombre del lugar va en su propia fila, a todo el ancho de la barra, sin cortarse. */
  @media (max-width:480px) {
    #barra { grid-template-areas:"lugar lugar lugar lugar lugar lugar" "inicio atras play adelante . mapa"; }
    #lugar { grid-area:lugar; padding:2px 4px 0; }

    #inicio { grid-area:inicio; } #atras { grid-area:atras; } #play { grid-area:play; } #adelante { grid-area:adelante; } #mapaBtn { grid-area:mapa; }
    .volver { padding:0 14px; font-size:13px; } .volver .largo { display:none; } .volver .corto { display:inline; }
    #info .orden { display:none; }
  }
  #mapa { position:fixed; left:16px; bottom:88px; width:min(380px, calc(100vw - 32px)); background:var(--panel); border:1px solid var(--linea-2); border-radius:18px; padding:12px; box-sizing:border-box; }
  #mapa[hidden] { display:none; }
  #mapa svg#planta { width:100%; height:auto; display:block; max-height:calc(100vh - 260px); }
  #mapa p { margin:6px 0 0; font-size:12px; color:var(--tenue); }
  #leyenda { display:flex; flex-wrap:wrap; gap:4px 12px; margin:8px 0 0; padding:0; list-style:none; font-size:12px; color:var(--tenue); }
  #leyenda li { display:flex; align-items:center; gap:4px; }
  .nodo-mapa, .foto-mapa { cursor:pointer; outline:none; }
  #velo { position:fixed; inset:0; background:var(--fondo); opacity:0; pointer-events:none; }
  #fotos { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; background:rgba(21,19,15,.72); }
  #fotos[hidden] { display:none; }
  #fotos .caja { background:var(--panel); border:1px solid var(--linea-2); border-radius:18px; padding:12px; width:min(960px, 100%); max-height:100%; box-sizing:border-box; display:flex; flex-direction:column; gap:8px; overflow:auto; }
  #fotos .cab { display:flex; gap:12px; align-items:flex-start; justify-content:space-between; }
  #fotos h2 { margin:0; font-size:15px; font-weight:600; }
  #fotos .cab p { margin:2px 0 0; font-size:13px; color:var(--tenue); }
  #fotos img { width:100%; height:auto; aspect-ratio:1280/719; object-fit:cover; border-radius:10px; background:var(--fondo); display:block; }
  #fotos .pie { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; font-size:13px; }
  #fotos .pie span { color:var(--tenue); text-align:center; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

<body>

  </div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.2.0/dist/spark.module.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';

const q = new URLSearchParams(location.search);
const archivo = 'tramo_movil.sog';  // en la galería siempre la versión liviana
const depurar = q.has('depurar');
const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
const estado = document.getElementById('estado');
// Cifras en español: punto de miles y coma decimal (1.002.362 splats · 15,4 MB).
const num = (x, dec = 0) => { const [e, d] = Math.abs(x).toFixed(dec).split('.'); return (x < 0 ? '−' : '') + e.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (d ? ',' + d : ''); };
const t0 = performance.now();
const D = await (await fetch('recorrido.json')).json();
const { nodos, ruta, muros } = D;
const RUTA = ruta.map(r => new THREE.Vector3(r[0], r[1], r[2]));
// Campo de visión de la captura por clip (fov_por_clip, de las cámaras de COLMAP): en un mismo piso hay clips en
// horizontal y en vertical, y alguno con el lente 1x. Cada parada trae el fovY de su clip; entre paradas se interpola.
const clipDe = img => D.fov_por_clip[img.split('_')[0] + '_'];
nodos.forEach(n => { n.fovX = clipDe(n.imagen).fovX; });
const nodoInicial = THREE.MathUtils.clamp(+(q.get('nodo') || 0) || 0, 0, nodos.length - 1);
let fovBase = nodos[nodoInicial].fovY, fovXBase = nodos[nodoInicial].fovX;

// Escena en el marco del edificio de E1: z = normal del piso, piso en z = 0. «Arriba» de la cámara = z, sin giro lateral.
const renderer = new THREE.WebGLRenderer({ antialias:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15130f);
const camera = new THREE.PerspectiveCamera(fovBase, innerWidth/innerHeight, 0.01, 200);
camera.up.set(0, 0, 1);
// Campo de visión en pantalla: se parte del vertical de la captura; en pantalla angosta se abre hasta 60° de ancho con
// tope de 90° vertical, y en pantalla ancha el ancho no pasa del mayor entre el ancho de la captura y 90°.
const ANCHO_MIN = 60, ANCHO_MAX = 90, VERTICAL_MAX = 90;
function ajustarCampo() {
  const a = innerWidth/innerHeight, rad = THREE.MathUtils.degToRad, grad = THREE.MathUtils.radToDeg;
  const verticalPara = ancho => 2 * grad(Math.atan(Math.tan(rad(ancho / 2)) / a));
  const anchoDe = v => 2 * grad(Math.atan(Math.tan(rad(v / 2)) * a));
  let v = fovBase;
  if (anchoDe(v) < ANCHO_MIN) v = Math.max(v, Math.min(VERTICAL_MAX, verticalPara(ANCHO_MIN)));
  else { const tope = Math.max(fovXBase, ANCHO_MAX); if (anchoDe(v) > tope) v = verticalPara(tope); }
  camera.aspect = a; camera.fov = v; camera.updateProjectionMatrix();
}
ajustarCampo();
scene.add(new SparkRenderer({ renderer }));

// El splat está en coordenadas de COLMAP: se le aplica T_edificio_desde_colmap (rotación propia, det = 1, sin escala).
const T = new THREE.Matrix4().set(...D.T_edificio_desde_colmap.flat());
let bytes = 0;
const splat = new SplatMesh({ url: archivo, onProgress: e => { bytes = e.loaded; estado.textContent = `cargando ${num(e.loaded/1048576, 1)} MB…`; } });
T.decompose(splat.position, splat.quaternion, splat.scale);
scene.add(splat);

// Muros invisibles: cajas finas donde los muros de planos.json tienen puntos. Solo para el raycast, para ocultar discos
// y para el camino. El vidrio que la revisión visual vio transparente no tapa discos (el disco va más tenue), pero para
// caminar es muro igual. Con ?depurar=1: muros en rojo, vidrio en azul, posible vidrio en ámbar.
const VIDRIO_TRANSPARENTE = new Set(['vidrio_revision', 'vidrio_bitacora']);
const unir = gs => gs.length ? mergeGeometries(gs) : new THREE.BufferGeometry();   // mergeGeometries([]) de three r186 falla en geometries[0]
const caja = m => new THREE.BoxGeometry(...m.t).translate(...m.c);
const matDepurar = color => new THREE.MeshBasicMaterial({ visible: depurar, color, wireframe:true, depthTest:false, transparent:true, opacity:.35 });
const muroMesh = new THREE.Mesh(unir(muros.filter(m => !VIDRIO_TRANSPARENTE.has(m.vidrio)).map(caja)), matDepurar(0xff5a3c));
const vidrioMesh = new THREE.Mesh(unir(muros.filter(m => VIDRIO_TRANSPARENTE.has(m.vidrio)).map(caja)), matDepurar(0x5aa9ff));
const posibleMesh = new THREE.Mesh(unir(muros.filter(m => m.vidrio === 'posible').map(caja)), matDepurar(0xf4b545));  // solo para ver
muroMesh.renderOrder = vidrioMesh.renderOrder = posibleMesh.renderOrder = 5;
scene.add(muroMesh, vidrioMesh, posibleMesh);

// Discos sobre el piso real (z = 0).
const R_DISCO = 0.22;
const matAro = new THREE.MeshBasicMaterial({ color:0xefe9de, transparent:true, opacity:.9, depthTest:false, depthWrite:false, side:THREE.DoubleSide });
const matRelleno = new THREE.MeshBasicMaterial({ color:0xefe9de, transparent:true, opacity:.22, depthTest:false, depthWrite:false, side:THREE.DoubleSide });
const matHover = new THREE.MeshBasicMaterial({ color:0xefe9de, transparent:true, opacity:.5, depthTest:false, depthWrite:false, side:THREE.DoubleSide });
const matOculto = new THREE.MeshBasicMaterial({ color:0xff5a3c, transparent:true, opacity:.8, depthTest:false, depthWrite:false, side:THREE.DoubleSide });
const matAroVidrio = new THREE.MeshBasicMaterial({ color:0xefe9de, transparent:true, opacity:.45, depthTest:false, depthWrite:false, side:THREE.DoubleSide });  // disco visto a través de vidrio
const geoAro = new THREE.RingGeometry(R_DISCO*0.75, R_DISCO, 48), geoRelleno = new THREE.CircleGeometry(R_DISCO*0.75, 48);
const geoToque = new THREE.CircleGeometry(R_DISCO*1.6, 24);  // área de toque más grande que el dibujo
const discos = nodos.map(n => {
  const g = new THREE.Group(); g.position.set(n.p[0], n.p[1], 0.005);
  const aro = new THREE.Mesh(geoAro, matAro), relleno = new THREE.Mesh(geoRelleno, matRelleno);
  const toque = new THREE.Mesh(geoToque, new THREE.MeshBasicMaterial({ visible:false }));
  aro.renderOrder = relleno.renderOrder = 10; toque.userData.nodo = n.id;
  g.add(relleno, aro, toque); scene.add(g);
  return { g, aro, relleno, toque, oculto:false, visible:true };
});

// Camino espacial (19 oct, observaciones de Raúl; PANEL-RECORRIDO.md D1). Antes se viajaba por la ruta en el orden del
// video: entre dos paradas a 0,3 m se recorrían 96 m. Grafo: vértices = cuadros de la ruta cada 0,3 m del plano;
// aristas = pasos consecutivos de un mismo clip de hasta 1,5 m, que son lo grabado aunque alguna caja de muro mal puesta
// los cruce (la recta que une dos clips y los saltos del seguimiento no son camino), y atajos de hasta 1,5 m que no cortan
// ninguna caja de muro, con menos de 0,15 u de diferencia de altura. Dijkstra, y luego se tira del hilo: desde
// cada punto se salta al más lejano que se ve a menos de 1,5 m. La escala (m del plano por u) es derivada, no medida.
const M_POR_U = D.m_por_u;
const GRAFO = (() => {
  const clips = D.clips || [['', 0]], clipDeCuadro = i => { let c = 0; for (let k = 0; k < clips.length; k++) if (clips[k][1] <= i) c = k; return c; };
  const cajas = muros.map(m => ({ lo: m.c.map((c, k) => c - m.t[k] / 2), hi: m.c.map((c, k) => c + m.t[k] / 2) }));
  const corta = (P, Q) => cajas.some(({ lo, hi }) => { let a0 = 0, a1 = 1; for (let k = 0; k < 3; k++) { const d = Q[k] - P[k]; if (Math.abs(d) < 1e-12) { if (P[k] < lo[k] || P[k] > hi[k]) return false; continue; } let a = (lo[k] - P[k]) / d, b = (hi[k] - P[k]) / d; if (a > b) [a, b] = [b, a]; if (a > a0) a0 = a; if (b < a1) a1 = b; if (a0 > a1) return false; } return true; });
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  const paso = 0.3 / M_POR_U, atajo = 1.5 / M_POR_U, esNodo = new Set(nodos.map(n => n.cuadro));
  const V = [], deCuadro = new Map(); let ult = null;
  ruta.forEach((r, i) => { const p = r.slice(0, 3); if (esNodo.has(i) || !ult || dist(p, ult) >= paso || (i > 0 && clipDeCuadro(i) !== clipDeCuadro(i - 1)) || i === ruta.length - 1) { deCuadro.set(i, V.length); V.push({ p, clip: clipDeCuadro(i) }); ult = p; } });
  const A = V.map(() => []), une = (a, b, w) => { A[a].push([b, w]); A[b].push([a, w]); };
  for (let i = 1; i < V.length; i++) { const d = dist(V[i].p, V[i - 1].p); if (V[i].clip === V[i - 1].clip && d <= atajo) une(i - 1, i, d); }
  for (let i = 0; i < V.length; i++) for (let j = i + 2; j < V.length; j++) { const d = dist(V[i].p, V[j].p); if (d <= atajo && Math.abs(V[i].p[2] - V[j].p[2]) < 0.15 && !corta(V[i].p, V[j].p)) une(i, j, d); }
  // Cobertura de dirección: cuadros de la ruta en celdas de 0,5 u, con su yaw.
  const celdas = new Map(), clave = (x, y) => Math.floor(x / 0.5) + ',' + Math.floor(y / 0.5);
  ruta.forEach(r => { const k = clave(r[0], r[1]); if (!celdas.has(k)) celdas.set(k, []); celdas.get(k).push(r); });
  return { V, A, corta, dist, deCuadro, atajo, celdas, clave };
})();
function caminoEspacial(desde, destino) {
  const { V, A, corta, dist, atajo } = GRAFO, n = V.length, fin = GRAFO.deCuadro.get(destino.cuadro), meta = destino.p;
  if (dist(desde, meta) <= atajo && Math.abs(desde[2] - meta[2]) < 0.15 && !corta(desde, meta)) return [desde, meta];   // se ve y está cerca: directo
  const dd = new Float64Array(n).fill(Infinity), prev = new Int32Array(n).fill(-1), hecho = new Uint8Array(n);
  V.forEach((v, i) => { const d = dist(desde, v.p); if (d <= atajo && !corta(desde, v.p)) { dd[i] = d; prev[i] = -2; } });
  if (!dd.some(isFinite)) { let b = 0; V.forEach((v, i) => { if (dist(desde, v.p) < dist(desde, V[b].p)) b = i; }); dd[b] = dist(desde, V[b].p); prev[b] = -2; }
  for (;;) { let u = -1, m = Infinity; for (let i = 0; i < n; i++) if (!hecho[i] && dd[i] < m) { m = dd[i]; u = i; } if (u < 0 || u === fin) break; hecho[u] = 1; for (const [v, w] of A[u]) if (dd[u] + w < dd[v]) { dd[v] = dd[u] + w; prev[v] = u; } }
  if (!isFinite(dd[fin])) return [desde, meta];   // no pasa con los datos de hoy (un solo componente por piso); queda el fundido
  const pts = [meta]; for (let u = fin; u >= 0; u = prev[u]) pts.push(V[u].p); pts.push(desde); pts.reverse();
  const out = [pts[0]]; for (let i = 0; i < pts.length - 1;) { let j = pts.length - 1; while (j > i + 1 && (dist(pts[i], pts[j]) > atajo || corta(pts[i], pts[j]))) j--; out.push(pts[j]); i = j; }
  return out;
}
// Parte del camino sin un cuadro grabado a menos de 0,5 u que mire a menos de 60° de la marcha (muestras cada 0,1 u).
function sinCobertura(pts) {
  let total = 0, falta = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], L = Math.hypot(b[0] - a[0], b[1] - a[1]); if (L < 1e-6) continue;
    const rumbo = Math.atan2(b[1] - a[1], b[0] - a[0]), n = Math.max(1, Math.ceil(L / 0.1));
    for (let k = 0; k < n; k++) {
      const f = (k + 0.5) / n, x = a[0] + (b[0] - a[0]) * f, y = a[1] + (b[1] - a[1]) * f; let ok = false;
      for (let dx = -1; dx <= 1 && !ok; dx++) for (let dy = -1; dy <= 1 && !ok; dy++) {
        for (const r of GRAFO.celdas.get(GRAFO.clave(x + dx * 0.5, y + dy * 0.5)) || []) {
          if (Math.hypot(r[0] - x, r[1] - y) < 0.5 && Math.abs(Math.atan2(Math.sin(r[3] - rumbo), Math.cos(r[3] - rumbo))) < Math.PI / 3) { ok = true; break; }
        }
      }
      total += L / n; if (!ok) falta += L / n;
    }
  }
  return total ? falta / total : 0;
}

// Estado de la cámara: posición, yaw (giro en planta, desde +x) y pitch.
let actual = nodoInicial;
const cam = { p: new THREE.Vector3(...nodos[actual].p), yaw: nodos[actual].yaw, pitch: nodos[actual].pitch };
let anim = null, jugando = false, esperaGuiada = 0, hover = -1, ultimoViaje = null, mensajeInicio = false;

// Transición (D1 y D2): vuelo por el camino espacial con crucero de 2,0 m del plano/s y rampas fijas de 0,15 s al
// arrancar y al frenar; duración = largo ÷ velocidad + 0,15 s (lo que cuestan las dos rampas), entre 0,6 y 4,0 s; en los
// viajes cortos, que duran el mínimo, el crucero baja de 2,0. Fundido de 0,6 s si pasaría de 4,0 s, si a más del 40 % del camino le
// falta cobertura de dirección, con movimiento reducido o al volver al inicio. Antes de moverse, 0,2 s con el camino dibujado.
const V_CRUCERO = 2.0 / M_POR_U, RAMPA = 0.15, T_MIN = 0.6, T_MAX = 4.0, MEDIO_FUNDIDO = 0.3, PREVIA = 0.2, GIRO_MAX = Math.PI / 2, GIRO_FINAL = 0.6;
const angulo = a => Math.atan2(Math.sin(a), Math.cos(a));
function ir(j, { anunciar = true, fundido = false } = {}) {
  if (j < 0 || j >= nodos.length) return;
  const destino = nodos[j], desde = cam.p.toArray();
  const pts = caminoEspacial(desde, destino);

  const s = ((performance.now()-t0)/1000).toFixed(1);
  estado.textContent = `${splat.numSplats != null ? num(splat.numSplats) + ' splats · ' : ''}${num(bytes/1048576, 1)} MB · listo en ${num(+s, 1)} s`;
  listo = true; window.__e9.listo = true; window.__e9.segundos = +s; window.__e9.mb = bytes/1048576;
}).catch(e => { estado.textContent = 'no se pudo cargar: ' + e.message; window.__e9.error = String(e); });

// ?cuadro=N (solo comprobación): la cámara de la captura en el marco del edificio, sin discos ni barra.
let poseFija = null;
if (q.has('cuadro')) {
  // La galería no publica camaras.json (daba 404): la pose sale de ruta[N], que es esa misma cámara de COLMAP en el marco
  // del edificio (posición, yaw y pitch; sin el giro sobre el eje de mira), y el campo de visión, del clip de ese cuadro.
  const k = THREE.MathUtils.clamp(Math.round(+q.get('cuadro')) || 0, 0, ruta.length - 1), rk = ruta[k];
  const clip = (D.clips || []).reduce((c, x) => x[1] <= k ? x[0] : c, null);
  poseFija = { k, fov: clip ? D.fov_por_clip[clip].fovY : fovBase };
  cam.p.set(rk[0], rk[1], rk[2]); cam.yaw = rk[3]; cam.pitch = rk[4];
  for (const id of ['barra', 'arriba', 'mapa']) document.getElementById(id).hidden = true;
  document.getElementById('arriba').style.display = 'none';
}
let ultimo = performance.now();
const mira = new THREE.Vector3();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.1, (now-ultimo)/1000); ultimo = now;
  if (anim) paso(dt);
  else if (jugando) {
    esperaGuiada -= dt;
    if (esperaGuiada <= 0) { if (actual < nodos.length - 1) ir(actual + 1); else pararGuiado(); }
  }
  camera.position.copy(cam.p);
  mira.set(Math.cos(cam.pitch)*Math.cos(cam.yaw), Math.cos(cam.pitch)*Math.sin(cam.yaw), Math.sin(cam.pitch)).add(cam.p);
  camera.lookAt(mira);
  if (poseFija) { if (camera.fov !== poseFija.fov) { camera.fov = poseFija.fov; camera.updateProjectionMatrix(); } discos.forEach(d => d.g.visible = false); }
  else ocultar();
  yo.setAttribute('transform', `translate(${cam.p.x.toFixed(3)},${(-cam.p.y).toFixed(3)}) rotate(${(-cam.yaw*180/Math.PI).toFixed(1)})`);
  renderer.render(scene, camera);
  if (listo && primerCuadro === null) { primerCuadro = ((performance.now()-t0)/1000); window.__e9.primerCuadro = +primerCuadro.toFixed(2); }
});

// Ganchos para la prueba automática.
window.__e9 = {
  listo:false, nodo: () => actual, moviendo: () => !!anim, ir: j => ir(j), pantalla, inicio: irAlInicio,
  viaje: () => ultimoViaje, fotosAbiertas: () => !ventana.hidden, mapaAbierto: () => !mapa.hidden, m_por_u: M_POR_U,
  camino: (i, j) => caminoEspacial(nodos[i].p, nodos[j]),
  marcador: () => yo.getAttribute('transform'),
  camara: () => ({ p: cam.p.toArray(), yaw: cam.yaw, pitch: cam.pitch, fov: camera.fov, fovBase, fovXBase, arriba: new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion).toArray() }),
  mirar: (yaw, pitch) => { cam.yaw = yaw; cam.pitch = pitch; },
};
</script>
